services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: laravel-app
        volumes:
            - .:/var/www
        depends_on:
            - db
#        environment:
#            APP_ENV: production
#            APP_DEBUG: false
#            APP_KEY: base64:SomeRandomKeyHere==
#            DB_HOST: db
#            DB_PORT: 3306
#            DB_DATABASE: laravel
#            DB_USERNAME: laravel
#            DB_PASSWORD: secret
        ports:
            - "8080:80"

    db:
        image: mysql:8
        container_name: mysql-db
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3306:3306"

volumes:
    dbdata:
