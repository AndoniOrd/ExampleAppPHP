services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: laravel-app
        volumes:
            - .:/var/www
        depends_on:
            - db
        networks:
            - private

    db:
        image: mysql:8
        container_name: mysql-db
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3306:3306"
        networks:
            - private

volumes:
    dbdata:

networks:
    private:
        driver: bridge
